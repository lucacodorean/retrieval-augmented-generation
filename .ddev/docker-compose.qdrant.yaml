services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: ddev-${DDEV_SITENAME}-qdrant
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: $DDEV_APPROOT
    volumes:
      - qdrant_storage:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

volumes:
  qdrant_storage:
    name: ddev-${DDEV_SITENAME}-qdrant-storage
